name: Pipeline Automatizado de Notícias - Vieira News

on:
  # Executa automaticamente de forma agendada (ex: a cada 6 horas)
  schedule:
    - cron: "0 */6 * * *"
  # Permite execução manual no painel Actions do GitHub
  workflow_dispatch:
  # Executa sempre que houver push na branch principal
  push:
    branches:
      - main

# Permissões necessárias para salvar no repositório e publicar no GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Permite apenas uma implantação concorrente no Pages
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  executar-portal:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Executar Pipeline de IA (Fase 1, 2 e 3)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python fase3_exportacao.py

      - name: 🌐 Construir Frontend Estático (Fase 4)
        run: |
          python construtor_site.py

      - name: 🚀 Salvar Alterações no Repositório (Git Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias_prontas/ public/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada para commit."
          else
            git commit -m "chore(auto): pipeline de notícias e rebuild do frontend [skip ci]"
            git push origin main
          fi

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Fazer Upload do Artefato (pasta public)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public/"

      - name: 🚀 Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
